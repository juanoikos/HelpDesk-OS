name: Postgres Backup to R2
on: {schedule: [{cron: "0 */6 * * *"}], workflow_dispatch: {}}
jobs: {backup: {runs-on: ubuntu-latest, steps: [{name: "Generar dump comprimido (pg_dump 18 via Docker)", env: {DATABASE_PUBLIC_URL: "${{ secrets.DATABASE_PUBLIC_URL }}"}, run: "set -e -o pipefail\nTIMESTAMP=$(date -u +%Y%m%d-%H%M%S)\nFILENAME=helpdeskos-postgres-$TIMESTAMP.sql.gz\ndocker run --rm postgres:18 pg_dump \"$DATABASE_PUBLIC_URL\" | gzip > \"$FILENAME\"\ntest -s \"$FILENAME\"\necho \"FILENAME=$FILENAME\" >> \"$GITHUB_ENV\"\necho \"Dump generado: $FILENAME ($(du -h $FILENAME | cut -f1))\""}, {name: "Subir a Cloudflare R2", env: {AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}", AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}", AWS_DEFAULT_REGION: "auto"}, run: "set -e -o pipefail\npip install --quiet awscli\nENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\naws s3 cp \"$FILENAME\" \"s3://${{ secrets.R2_BUCKET_NAME }}/backups/postgres/$FILENAME\" --endpoint-url \"$ENDPOINT\""}, {name: "Limpiar backups viejos (conservar 30)", env: {AWS_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}", AWS_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}", AWS_DEFAULT_REGION: "auto"}, run: "set -e -o pipefail\nENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\nBUCKET=${{ secrets.R2_BUCKET_NAME }}\naws s3 ls \"s3://$BUCKET/backups/postgres/\" --endpoint-url \"$ENDPOINT\" | sort | head -n -30 | awk '{print $4}' | while read -r f; do if [ -n \"$f\" ]; then echo \"Eliminando: $f\"; aws s3 rm \"s3://$BUCKET/backups/postgres/$f\" --endpoint-url \"$ENDPOINT\"; fi; done"}]}}
